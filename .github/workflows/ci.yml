name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: x_com_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d x_com_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Plain test values: CI config shouldn't depend on repo secrets, and
    # secrets are unavailable on PRs from forks anyway.
    env:
      # App settings
      APP_NAME: USSCI
      ENVIRONMENT: test
      DEBUG: "true"
      LOG_LEVEL: INFO

      # Database settings
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/x_com_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/x_com_test

      # 5 min db io throttling time
      DB_IO_SESSION_THROTTLING_TIME_S: "300"

      # Redis settings
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/0

      # Header settings (security)
      SECRET_HEADER_NAME: x
      SECRET_HEADER_VALUE: xx

      # Swagger settings (Starlette/FastAPI paths must start with "/")
      API_DOCS_URL: /docs
      API_REDOC_URL: /redoc
      OPENAPI_URL: /openapi.json

      # JWT settings (dummy values for tests only)
      ACCESS_JWT_SECRET_KEY: test-access-secret-key-at-least-32-chars-long
      REFRESH_JWT_SECRET_KEY: test-refresh-secret-key-at-least-32-chars-long
      ACCESS_JWT_EXPIRY_SEC: "900"
      REFRESH_JWT_EXPIRY_SEC: "604800"
      JWT_ALGORITHM: HS256

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --all-groups --frozen

      - name: Run Migrations
        run: uv run alembic upgrade head

      - name: Run Pytest
        run: uv run pytest

  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: x-com:test
          cache-from: type=gha
          cache-to: type=gha,mode=max